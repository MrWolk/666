# ALLIN Miner 1.0.0
mining:
  base-seconds: 10.0
  min-seconds: 1.0
  level-seconds-reduction: 1.0
  efficiency-seconds-reduction: 0.75
  no-pickaxe-penalty: 3.0

reward:
  min: 1
  max: 3

point:
  keep-current-block: false

# Сумма шансов должна быть 1.0 (100%).
# Чем дороже руда, тем меньше шанс.
ores:
  - material: COAL_ORE
    chance: 0.35
  - material: COPPER_ORE
    chance: 0.20
  - material: IRON_ORE
    chance: 0.15
  - material: GOLD_ORE
    chance: 0.10
  - material: REDSTONE_ORE
    chance: 0.07
  - material: LAPIS_ORE
    chance: 0.05
  - material: EMERALD_ORE
    chance: 0.04
  - material: DIAMOND_ORE
    chance: 0.03
  - material: ANCIENT_DEBRIS
    chance: 0.01
